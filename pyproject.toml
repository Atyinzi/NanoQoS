[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoqos"
version = "0.1.0"
maintainers = [{ name = "Atyinzi" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "Online inference scheduling and measurement built on nano-vLLM"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
]

[project.urls]
Homepage="https://github.com/Atyinzi/NanoQoS"
Upstream="https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
